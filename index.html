<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>腹膜透析（洗肚子）認識與體驗｜嘉義基督教醫院 腎臟內科</title>

<!--
═══════════════════════════════════════════════════════════════════
  一份檔案，手機（直/橫式）與電視（橫式）通用。
  ① 置入嘉基影片：程式碼最上面 const VIDEOS = {...}
     YouTube 用 yt："youtu.be/DpGCm-MhRe0" → 只填 "DpGCm-MhRe0"。
     Vimeo 用 vimeo："vimeo.com/378770445" → 只填 "378770445"。留空("")顯示插槽示意。
  ② 操作：手機／平板直接用手指點。
     （原「電視遙控器」鍵盤操作與「🔊 朗讀」語音已移除：現場都用觸控裝置，且每步都有影片與大字字幕。）
  ③ CAPD 體驗：親手做「接管」與「分離」兩步（搭配體驗圍裙＋練習藥水），
     中間的引流＋注入合併成一段影片帶過（不用動手，傳達「就這麼簡單」）。
     每一步先播示範影片的對應剪段（const CAPD_VIDEO 可調秒數；留空則顯示插畫）。
═══════════════════════════════════════════════════════════════════
-->

<style>
  :root{
    --brand:#CB5A50; --brand-deep:#A8413A; --brand-soft:#FBF1EF; --brand-tint:#F3D7D2;
    --pd:#2A7F74; --pd-soft:#E3F0EE; --hd:#3E6B9E; --hd-soft:#E7EEF6;
    --gold:#B7892F; --gold-soft:#F4ECDB;
    --ink:#2B2622; --muted:#7a726c; --line:#EADCD8; --ok:#2A7F74; --warn:#B5462E; --paper:#fffdfc;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:rgba(203,90,80,.15);}
  html,body{height:100%;}
  body{font-family:"Microsoft JhengHei","Noto Sans TC","PingFang TC",Arial,sans-serif;
    background:var(--brand-soft); color:var(--ink); font-size:20px; line-height:1.65;
    display:flex; flex-direction:column; min-height:100vh; -webkit-text-size-adjust:100%;}
  header{background:var(--brand); color:#fff; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .brand b{font-size:21px; font-weight:800; display:block;} .brand span{font-size:15px; opacity:.9;}

  .progress{padding:12px 18px 0;}
  .bar{height:10px; background:var(--brand-tint); border-radius:999px; overflow:hidden;}
  .bar i{display:block; height:100%; width:0; background:var(--brand); transition:width .4s ease;}
  .ptext{font-size:15px; color:var(--muted); margin-top:6px;}

  main{flex:1; display:flex; justify-content:center; padding:18px 16px 120px;}
  .stage{width:100%; max-width:640px;}
  .eyebrow{color:var(--brand); font-weight:800; letter-spacing:.06em; font-size:16px;}
  h1{font-size:29px; line-height:1.32; margin:8px 0 6px; font-weight:800;}
  p.lead{font-size:20px; color:#3a352f; margin:10px 0;}

  .video{margin:14px 0; border-radius:16px; overflow:hidden; background:#0e1413;
    aspect-ratio:16/9; position:relative; display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 22px rgba(43,38,34,.16);}
  .video video{width:100%; height:100%; object-fit:contain; background:#000;}
  .vfacade{cursor:pointer;}
  .vposter{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:#0e1413;}
  .vfacade .playbtn{position:relative; z-index:1;}
  @media (hover:hover){ .vfacade:hover .playbtn{transform:scale(1.08); background:#fff;} }
  .vstage{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:12px; color:#eef6f4; text-align:center; padding:20px; background:radial-gradient(120% 90% at 50% 30%,#243b39 0%,#0e1413 70%);}
  .playbtn{width:78px; height:78px; border-radius:50%; background:rgba(255,255,255,.96); color:var(--brand);
    display:flex; align-items:center; justify-content:center; font-size:34px; cursor:pointer; border:none; box-shadow:0 8px 24px rgba(0,0,0,.4);}
  .vstage .label{font-size:18px; font-weight:700;} .vstage small{opacity:.7; font-size:13px;}

  .card{background:var(--paper); border:1.5px solid var(--line); border-radius:16px; padding:18px; margin:12px 0;
    box-shadow:0 2px 10px rgba(43,38,34,.05);}
  .q{font-size:23px; font-weight:800; margin-bottom:14px;}
  .opts{display:grid; gap:12px;}

  .opt,.chk{font-family:inherit; color:var(--ink); cursor:pointer; background:#fff;
    border:2.5px solid var(--line); border-radius:14px; transition:.12s; width:100%; text-align:left;}
  .opt{display:flex; align-items:center; gap:14px; padding:16px 18px; font-size:21px; min-height:66px;}
  .num{flex:none; width:36px; height:36px; border-radius:9px; background:var(--brand-tint); color:var(--brand-deep);
    font-size:19px; font-weight:800; display:flex; align-items:center; justify-content:center;}
  .opt.sel{border-color:var(--brand); background:#fdeeec;}
  .opt.correct{border-color:var(--ok); background:#e7f3ef;} .opt.correct .num{background:var(--ok); color:#fff;}
  .opt.wrong{border-color:var(--warn); background:#f7e9e4;} .opt.wrong .num{background:var(--warn); color:#fff;}
  .opt .tag{margin-left:auto; font-size:15px; font-weight:800;}
  .opt.correct .tag{color:var(--ok);} .opt.wrong .tag{color:var(--warn);}

  .feedback{margin-top:12px; padding:15px; border-radius:12px; font-size:17px; display:none;}
  .feedback.show{display:block;}
  .feedback.good{background:#e7f3ef; border-left:6px solid var(--ok);}
  .feedback.tip{background:#fdeeec; border-left:6px solid var(--brand);}

  /* 四選項卡 */
  .four{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:14px 0;}
  .ocard{border-radius:16px; padding:16px; border:2.5px solid var(--line); background:#fff;}
  .ocard .h{font-size:21px; font-weight:800; display:flex; align-items:center; gap:8px; margin-bottom:5px;}
  .ocard .h .ico{width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:20px; flex:none;}
  .ocard p{font-size:17px; color:var(--muted); line-height:1.5;}
  .ocard.pd{border-color:var(--pd);} .ocard.pd .ico{background:var(--pd-soft);}
  .ocard.hd{border-color:var(--hd);} .ocard.hd .ico{background:var(--hd-soft);}
  .ocard.tx{border-color:var(--gold);} .ocard.tx .ico{background:var(--gold-soft);}
  .ocard.cs{border-color:var(--muted);} .ocard.cs .ico{background:#efe9e6;}
  .note{background:var(--pd-soft); border-left:6px solid var(--pd); padding:14px; border-radius:12px; font-size:19px; margin-top:6px;}

  .checklist{display:grid; gap:11px; margin:14px 0;}
  .chk{display:flex; align-items:center; gap:12px; padding:15px 16px; font-size:19px;}
  .chk.sel{border-color:var(--pd); background:var(--pd-soft);}
  .chk .box{width:28px; height:28px; border-radius:7px; border:3px solid var(--brand-tint); flex:none;}
  .chk.sel .box{background:var(--pd); border-color:var(--pd);}

  /* CAPD 步驟追蹤 */
  .tracker{display:flex; gap:7px; flex-wrap:wrap; margin:14px 0;}
  .tchip{flex:1 1 0; min-width:60px; text-align:center; border:2px solid var(--line); border-radius:12px;
    padding:9px 3px; font-size:15px; font-weight:700; color:var(--muted); background:#fff;}
  .tchip .tn{display:flex; width:28px; height:28px; margin:0 auto 4px; border-radius:50%;
    background:var(--brand-tint); color:var(--brand-deep); align-items:center; justify-content:center; font-weight:800;}
  .tchip.active{border-color:var(--pd); background:var(--pd-soft); color:var(--pd);} .tchip.active .tn{background:var(--pd); color:#fff;}
  .tchip.done{border-color:var(--pd); color:var(--pd);} .tchip.done .tn{background:var(--pd); color:#fff;}
  .capd-svg{width:100%; max-width:440px; margin:8px auto; display:block; background:#fff; border:2px solid var(--line); border-radius:16px;}
  .capd-grid{display:grid; gap:4px;}
  .capd-note{font-size:16px; margin-top:14px;}
  .qa-grid{display:grid; gap:12px;}
  @media (min-width:900px){
    .capd-grid{grid-template-columns:1.35fr 1fr; gap:26px; align-items:center;}
    .capd-clip{max-width:none; margin:0;}
  }
  .capd-instr{font-size:22px; margin:12px 0; line-height:1.6;}
  .capd-do{background:var(--gold-soft); border-left:6px solid var(--gold); padding:14px; border-radius:12px; font-size:20px; margin:10px 0;}
  .capd-svg{aspect-ratio:4/3; object-fit:cover;}
  .capd-clip{max-width:520px; margin:8px auto 4px;}

  .nav{position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1.5px solid var(--line);
    padding:12px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; padding-bottom:max(12px,env(safe-area-inset-bottom));
    box-shadow:0 -2px 14px rgba(43,38,34,.07);}
  .btn{transition:.15s;}
  @media (hover:hover){
    .opt:hover,.chk:hover{border-color:var(--brand); box-shadow:0 2px 10px rgba(203,90,80,.18);}
    .btn.primary:hover:not(:disabled){background:var(--brand-deep);}
    .btn.ghost:hover{border-color:var(--muted); color:var(--ink);}
  }
  .btn{font-family:inherit; font-size:21px; font-weight:800; border-radius:13px; padding:15px 22px; cursor:pointer; border:none;}
  .btn.primary{background:var(--brand); color:#fff; flex:1;}
  .btn.primary:disabled{background:#e3c4bf; cursor:not-allowed;}
  .btn.ghost{background:#fff; color:var(--muted); border:2px solid var(--line); font-size:18px; padding:14px 16px; flex:none;}

  .summary{background:#fff; border:1.5px solid var(--line); border-radius:18px; overflow:hidden;}
  .summary .head{background:var(--brand); color:#fff; padding:18px 20px;}
  .summary .head b{font-size:21px;} .summary .head span{display:block; font-size:14px; opacity:.9; margin-top:4px;}
  .srow{padding:18px 20px; border-bottom:1.5px solid var(--line);} .srow:last-child{border:none;}
  .srow .k{font-size:17px; color:var(--muted); font-weight:800; letter-spacing:.05em; margin-bottom:8px;}
  .lean{display:inline-block; font-size:22px; font-weight:800; padding:8px 20px; border-radius:999px;}
  .lean.pd{background:var(--pd-soft); color:var(--pd);} .lean.more{background:var(--brand-tint); color:var(--brand-deep);} .lean.other{background:var(--hd-soft); color:var(--hd);}
  .pill{display:inline-block; background:var(--brand-tint); color:var(--brand-deep); border-radius:999px; padding:6px 14px; font-size:18px; font-weight:700; margin:0 6px 8px 0;}
  .gap{display:flex; gap:11px; align-items:flex-start; padding:11px 0; border-bottom:1px dashed var(--line);} .gap:last-child{border:none;}
  .gap .ic{flex:none; width:32px; height:32px; border-radius:50%; background:#f7e9e4; color:var(--warn); display:flex; align-items:center; justify-content:center; font-weight:900;}
  .gap.okrow .ic{background:#e7f3ef; color:var(--ok);}
  .ask{font-size:20px; padding:10px 0; border-bottom:1px dashed var(--line);} .ask:last-child{border:none;}
  .ask::before{content:"？"; color:var(--brand); font-weight:900; margin-right:10px;}

  .center{text-align:center;} .big-emoji{font-size:60px; margin:8px 0;}
  .welcome-steps{display:grid; gap:12px; margin:20px auto 10px; max-width:1080px;}
  .wcard{background:#fff; border:1.5px solid var(--line); border-radius:16px; padding:20px 18px; text-align:center;
    box-shadow:0 2px 10px rgba(43,38,34,.05);}
  .wcard .wico{font-size:42px; margin-bottom:8px;}
  .wcard b{display:block; font-size:20px; margin-bottom:6px; color:var(--brand-deep);}
  .wcard p{font-size:16px; color:var(--muted); line-height:1.55;}
  @media (min-width:720px){ .welcome-steps{grid-template-columns:1fr 1fr 1fr;} }
  .name-input{width:100%; font-family:inherit; font-size:19px; padding:15px; border:2.5px solid var(--line); border-radius:13px; margin-top:10px;}
  .hint{font-size:16px; color:var(--muted); margin-top:8px;}
  .toolbar{display:grid; gap:10px; margin-top:16px;}
  .toolbar .btn{flex:none; width:100%;}

  /* 大螢幕（衛教室電視/電腦）：目標是每一頁都不需捲動，滑鼠點選即可 */
  @media (min-width:1100px){
    body{font-size:21px;} header{padding:10px 40px;} .brand b{font-size:24px;} .brand span{font-size:15px;}
    .progress{padding:8px 40px 0;} main{padding:14px 40px 96px;} .stage{max-width:1380px; margin-block:auto;}
    .big-emoji{font-size:76px;}
    h1{font-size:28px; margin:4px 0 2px;} p.lead{font-size:20px; margin:6px 0;} .eyebrow{font-size:17px;}
    .q{font-size:24px;} .opt{font-size:22px; min-height:70px; padding:16px 22px; gap:16px;}
    .num{width:40px; height:40px; font-size:20px; border-radius:10px;}
    .four .ocard .h{font-size:22px;} .four .ocard p{font-size:17px;} .four .ocard .ico{width:42px; height:42px; font-size:22px;}
    .note{font-size:19px;} .chk{font-size:20px;} .feedback{font-size:20px;}
    .tracker{margin:10px 0;} .tchip{font-size:16px; min-width:100px;} .tchip .tn{width:30px; height:30px; font-size:18px;}
    .capd-svg{max-width:620px;} .capd-instr{font-size:22px; margin:10px 0;} .capd-do{font-size:20px;}
    .nav{padding:12px 40px;} .btn{font-size:22px; padding:14px 32px;} .btn.primary{flex:none;}
    .toolbar{display:flex; flex-wrap:wrap;} .toolbar .btn{width:auto;}
    .summary .head b{font-size:24px;} .srow{padding:14px 24px;}
    /* 電視一屏內看完：影片高度依視窗高度計算、QA 與勾選清單改欄狀 */
    .video{width:min(100%, calc((100vh - 360px) * 16 / 9)); margin-left:auto; margin-right:auto;}
    .capd-clip{width:min(100%, calc((100vh - 400px) * 16 / 9)); margin-left:auto; margin-right:auto;}
    .checklist{grid-template-columns:1fr 1fr; gap:12px;}
    .qa-grid{grid-template-columns:1fr 1.25fr; gap:22px; align-items:start;}
    .qa-grid .card{margin:0;}
  }
  @media (min-width:720px){ .four{grid-template-columns:1fr 1fr;} }
  @media (max-width:520px){ .four{grid-template-columns:1fr;} }

  /* 矮螢幕（手機橫式） */
  @media (max-height:560px) and (max-width:1099px){
    header{padding:8px 16px;} .brand b{font-size:16px;} .brand span{display:none;}
    .progress{padding:7px 16px 0;} .bar{height:8px;}
    main{padding:12px 16px 84px;} h1{font-size:21px; margin-top:4px;} p.lead{font-size:16px; margin:6px 0;}
    .video{height:48vh; aspect-ratio:auto;} .capd-svg{max-width:320px;}
    .nav{padding:8px 16px;} .btn{padding:11px 18px; font-size:17px;} .btn.ghost{padding:11px 13px; font-size:15px;}
    .card{padding:14px;} .q{font-size:18px;} .opt{min-height:54px; padding:12px 14px; font-size:17px;}
  }
  @media print{header,.progress,.nav,.toolbar{display:none!important;} main{padding:0;} body{background:#fff;}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>

<header>
  <div class="brand"><b>嘉義基督教醫院　腎臟內科</b><span>腹膜透析（洗肚子）・認識與體驗</span></div>
</header>

<div class="progress"><div class="bar"><i id="barFill"></i></div><div class="ptext" id="barText">準備開始</div></div>
<main><div class="stage" id="stage"></div></main>

<div class="nav">
  <button class="btn ghost" id="backBtn" onclick="prev()">◀ 上一步</button>
  <button class="btn primary" id="nextBtn" onclick="next()">開始 ▶</button>
</div>

<script>
/* ════════════ 影片設定：嘉基只改這裡 ════════════ */
const VIDEOS = {
  // yt＝YouTube 影片編號（youtu.be/XXXX 的 XXXX）；vimeo＝Vimeo 編號。擇一填寫。
  edu: { label:"腹膜透析完整解析（嘉基 顏正杰醫師）", yt:"DpGCm-MhRe0" },
};
/* 換液體驗的示範影片剪段：每步只播對應的那一小段。
   目前用「透析衛教工具包」的 CAPD 操作教學（vimeo.com/425888006，居家情境、大字字幕）：
   ① 接管(親手做) 3:17–3:44、② 引流＋排氣＋注入(看影片帶過) 3:57–5:02、③ 分離(親手做) 5:18–5:28
   clips＝[開始秒數, 結束秒數]，順序對應上面 CAPD 陣列，可自行微調；credit＝影片出處（顯示給病人看）。
   改用 YouTube：把 vimeo 留空、填 yt。vimeo 和 yt 都留空("")則顯示插畫。 */
const CAPD_VIDEO = { vimeo:"425888006", yt:"", credit:"透析衛教工具包",
  clips:[ [197,224], [237,302], [318,328] ] };
/* ═══════════════════════════════════════════════ */

const state={ name:"", answers:{}, concerns:[], asks:[], leaning:null, capdStep:0, _picked:undefined, _focus:'first' };

/* ── CAPD 體驗：親手做「接管」與「分離」兩個關鍵步驟；中間的引流、注入看影片帶過 ── */
const CAPD=[
  { short:'接管', t:'第一步：接管（親手做）',
    d:'把透析液的管路接頭，和你腹部導管的接頭小心接在一起。全程不要用手碰到接口，保持無菌。',
    do:'請拿起體驗圍裙上的導管，試著把管路接上。', svg:'<img class="capd-svg" src="img/capd-2.png" alt="把管路接上腹部導管">' },
  { short:'引流･注入', t:'中間兩段：引流、注入（看影片就好）', watch:true,
    d:'接好之後，先打開開關，讓肚子裡的舊藥水自己流到空袋（引流）；流乾淨後換邊，讓新藥水從高處流進肚子（注入）。這兩段不需要技巧，就是開著開關、坐著等它流完。',
    do:'這段今天不用動手，看影片感受一下——其實就是等藥水流完，就這麼簡單。', svg:'<img class="capd-svg" src="img/capd-3.png" alt="舊藥水流出、新藥水流入">' },
  { short:'分離', t:'最後一步：分離管路、蓋上保護帽（親手做）',
    d:'灌完後關上開關，把透析液的管路和你肚子上的導管小心分開，再接上新的「保護帽」把導管口蓋好，保持乾淨。',
    do:'關開關、把管路分開，幫導管口蓋上新的保護帽。', svg:'<img class="capd-svg" src="img/capd-5.png" alt="分開管路、蓋上保護帽">' },
];
/* 洗手與留置不做成互動步驟，改用文字帶過 */
const CAPD_PRE = { t:'開始前：先洗手、戴口罩',
  d:'先戴上口罩，用肥皂把手洗乾淨並擦乾。準備乾淨的桌面，檢查藥水袋清澈、沒有破損或漏液。準備好了我們就開始。' };
const CAPD_POST = { t:'做完之後：藥水留置，照常生活',
  d:'分開管路之後，新藥水會留在肚子裡停留幾個小時慢慢作用。這段時間你可以正常上班、做家事、出門走走，時間到了再做下一次換液。' };

const steps=[
{ id:'welcome', type:'welcome' },

{ id:'edu', type:'video', video:'edu', eyebrow:'先看一段影片', title:'腹膜透析（洗肚子）完整解析',
  lead:'由嘉基腎臟科顏正杰醫師說明：腎臟到末期有哪些選擇、腹膜透析（洗肚子）怎麼運作、和血液透析（洗血）要怎麼比較。看完影片後，我們會請你親手做一次換液體驗。' },

{ id:'capd', type:'capd', eyebrow:'親手體驗', title:'換液體驗：跟著做一次腹膜透析' },

{ id:'qa', type:'leaning', eyebrow:'最後：有問題盡量問', title:'看完也親手做過了，你想問什麼？',
  lead:'沒有對錯。勾選你想多了解的，等一下護理師會針對這些跟你說明。' },

{ id:'summary', type:'summary' },
];
const MAIN = steps.length-2; // 不含 summary 的主步驟數（顯示用）

let i=0;

function render(){
  const s=steps[i], stage=document.getElementById('stage');
  document.getElementById('barFill').style.width=Math.round(i/(steps.length-1)*100)+'%';
  document.getElementById('barText').textContent = s.type==='summary'?'完成！把摘要給護理師'
      : s.type==='capd'?`換液體驗　第 ${state.capdStep+1} / ${CAPD.length} 步`
      : s.type==='welcome'?'準備開始'
      : `第 ${i} / ${MAIN} 步`;
  document.getElementById('backBtn').style.visibility=i===0?'hidden':'visible';
  let h='';

  if(s.type==='welcome'){
    h=`<div class="center"><div class="big-emoji">🩺</div><div class="eyebrow">歡迎</div>
      <h1>認識腹膜透析，並親手體驗一次</h1>
      <p class="lead">今天有三個部分，跟著右下角的按鈕一步一步走就可以。</p>
      <div class="welcome-steps">
        <div class="wcard"><div class="wico">🎬</div><b>1　先看影片</b><p>嘉基醫師說明腹膜透析（洗肚子）是什麼、怎麼運作</p></div>
        <div class="wcard"><div class="wico">🧤</div><b>2　親手體驗</b><p>跟著示範影片，用體驗圍裙做一次換液操作</p></div>
        <div class="wcard"><div class="wico">💬</div><b>3　問護理師</b><p>勾選想了解的問題，護理師會當面為你說明</p></div>
      </div>
      <div class="hint">隨時可暫停、回上一步重看。</div></div>`;
  }
  else if(s.type==='four'){
    h=`<div class="eyebrow">${s.eyebrow}</div><h1>${s.title}</h1><p class="lead">${s.lead}</p>
      <div class="four">
        <div class="ocard pd"><div class="h"><span class="ico">🏠</span>腹膜透析（洗肚子）</div><p>在家自己做，時間彈性、不用常跑醫院。今天的主角。</p></div>
        <div class="ocard hd"><div class="h"><span class="ico">🏥</span>血液透析（洗血）</div><p>到醫院由機器洗血液，一週固定幾次、每次約 4 小時。</p></div>
        <div class="ocard tx"><div class="h"><span class="ico">🫘</span>腎臟移植</div><p>換上一顆健康的腎臟，需要等待合適的捐贈與配對。</p></div>
        <div class="ocard cs"><div class="h"><span class="ico">🤝</span>保守安寧照護</div><p>不洗腎，以症狀控制與舒適照顧為主的選擇。</p></div>
      </div>
      <div class="note">四種都是正當的選擇。今天我們先帶你深入認識並體驗 <b>腹膜透析（洗肚子）</b>；其他治療若想多了解，最後可以告訴護理師。</div>`;
  }
  else if(s.type==='video'){
    h=`<div class="eyebrow">${s.eyebrow}</div><h1>${s.title}</h1><p class="lead">${s.lead}</p>${videoBlock(s.video)}`;
  }
  else if(s.type==='video_concern'){
    h=`<div class="eyebrow">${s.eyebrow}</div><h1>${s.title}</h1><p class="lead">${s.lead}</p>${videoBlock(s.video)}
      <div class="card"><div class="q">看完後，你還想多了解哪些？（可複選）</div><div class="checklist">${s.items.map((t,x)=>
        `<div class="chk focusable ${state.concerns.includes(t)?'sel':''}" onclick="toggleConcern('${t}',${x})"><span class="num">${x+1}</span><div class="box"></div><div>${t}</div></div>`).join('')}</div></div>`;
  }
  else if(s.type==='quiz'){
    const ans=state.answers[s.id];
    h=`<div class="eyebrow">${s.eyebrow}</div><div class="card"><div class="q">${s.q}</div><div class="opts">
      ${s.options.map((o,x)=>{let c='opt focusable';
        if(ans!==undefined){if(o.correct)c+=' correct'; else if(state._picked===x)c+=' wrong';}
        const tag=ans!==undefined?(o.correct?'<span class="tag">✓ 正確</span>':(state._picked===x?'<span class="tag">再想想</span>':'')):'';
        return `<button class="${c}" onclick="answer('${s.id}',${x},${o.correct})"><span class="num">${x+1}</span><span>${o.t}</span>${tag}</button>`;}).join('')}</div>
      <div class="feedback ${ans===true?'good show':ans===false?'tip show':''}">${ans===true?s.good:s.tip}</div></div>`;
  }
  else if(s.type==='capd'){
    const cs=state.capdStep, st=CAPD[cs];
    h=`<div class="eyebrow">${s.eyebrow}</div><h1>${s.title}</h1>
      <div class="tracker">${CAPD.map((c,x)=>`<div class="tchip ${x<cs?'done':''} ${x===cs?'active':''}"><span class="tn">${x<cs?'✓':x+1}</span>${c.short}</div>`).join('')}</div>
      <div class="card">
        <div class="capd-grid">
          <div class="center">${capdMedia(cs)}</div>
          <div style="text-align:left">
            <div class="q">${st.t}</div>
            <div class="capd-instr">${st.d}</div>
            <div class="capd-do">${st.watch?'💡':'👉'} ${st.do}</div>
            ${cs===0?`<div class="note capd-note"><b>🧼 ${CAPD_PRE.t}</b>　${CAPD_PRE.d}</div>`:''}
            ${cs===CAPD.length-1?`<div class="note capd-note"><b>⏳ ${CAPD_POST.t}</b>　${CAPD_POST.d}</div>`:''}
          </div>
        </div>
      </div>`;
  }
  else if(s.type==='leaning'){
    const o=[['pd','體驗後我想選／想試試 腹膜透析（洗肚子）'],['more','對腹膜透析有興趣，但還想多了解'],['other','想了解其他治療（血液透析／移植等）']];
    h=`<div class="eyebrow">${s.eyebrow}</div><h1>${s.title}</h1>
      <div class="qa-grid">
        <div><p class="lead">${s.lead}</p>
          <div class="opts">${o.map((x,idx)=>`<button class="opt focusable ${state.leaning===x[0]?'sel':''}" onclick="setLean('${x[0]}')"><span class="num">${idx+1}</span><span>${x[1]}</span></button>`).join('')}</div></div>
        <div class="card"><div class="q">還有特別想問護理師的嗎？（可複選）</div><div class="checklist">${['感染（腹膜炎）怎麼預防','導管平常怎麼照顧','我年紀大／眼睛不好，做得到嗎','家人能不能幫我、要怎麼配合','洗澡、運動、生活會不會受影響','費用和健保給付','想再看一次換液操作','想了解其他治療（血液透析／移植）'].map((t,x)=>
        `<div class="chk focusable ${state.asks.includes(t)?'sel':''}" onclick="toggleAsk('${t}',${x})"><span class="num">${x+1}</span><div class="box"></div><div>${t}</div></div>`).join('')}</div></div>
      </div>`;
  }
  else if(s.type==='summary'){ h=summaryHTML(); }

  stage.innerHTML=h;
  if(s.type==='capd'&&CAPD_VIDEO.vimeo&&!CAPD_VIDEO.yt) armCapdVimeo();
  updateNext(); fitScreen(); window.scrollTo(0,0);
}

/* 衛教室電視：內容若超過一屏，整頁等比縮小到剛好一屏（滑鼠點選、不必捲動）。
   反覆量測最多 4 次，直到真的塞進一屏為止。窄螢幕（手機/平板直式）維持原尺寸可捲動。 */
function fitScreen(){ const b=document.body; b.style.zoom='';
  if(window.innerWidth<900) return;
  let z=1;
  for(let k=0;k<4;k++){
    const need=document.documentElement.scrollHeight, have=window.innerHeight;
    if(need<=have+1) break;
    z=Math.max(.5, z*have/need*.98); b.style.zoom=z;
  }
}
window.addEventListener('resize',()=>fitScreen());

function videoBlock(key){ const v=VIDEOS[key];
  if(v.yt){
    // 播放器預先載入、藏在封面底下；點封面＝使用者手勢，直接下 playVideo 指令（不依賴 autoplay，各瀏覽器都可靠）
    return `<div class="video">
      <iframe id="ytEdu" src="https://www.youtube-nocookie.com/embed/${v.yt}?rel=0&modestbranding=1&cc_lang_pref=zh-TW&enablejsapi=1" style="position:absolute;inset:0;width:100%;height:100%;border:0;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      <div class="vposter vfacade focusable" onclick="playYT(this)" title="播放影片">
        <img src="https://i.ytimg.com/vi/${v.yt}/maxresdefault.jpg" onerror="this.src='https://i.ytimg.com/vi/${v.yt}/hqdefault.jpg'" alt="${v.label}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">
        <button class="playbtn">▶</button></div></div>`; }
  if(v.vimeo){ const url=`https://player.vimeo.com/video/${v.vimeo}?title=0&byline=0&portrait=0&dnt=1&autoplay=1`;
    return `<div class="video"><iframe src="${url}" style="position:absolute;inset:0;width:100%;height:100%;border:0;" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>`; }
  return `<div class="video"><div class="vstage"><button class="playbtn focusable" onclick="simPlay(this)">▶</button>
    <div class="label">${v.label}</div><small>影片插槽（示意）— 嘉基置入影片後即可播放</small></div></div>`;
}
function simPlay(el){ el.textContent=el.textContent==='▶'?'⏸':'▶'; }

/* 點封面：藏起封面、對底下已就緒的播放器下「播放」指令（點擊＝使用者手勢，各瀏覽器可靠） */
function playYT(poster){ poster.style.display='none';
  const f=document.getElementById('ytEdu');
  if(f&&f.contentWindow) f.contentWindow.postMessage(JSON.stringify({event:'command',func:'playVideo',args:[]}),'*'); }

/* 換液體驗每一步：優先播該步的示範影片剪段，沒設定就顯示插畫 */
function capdMedia(cs){
  const c=CAPD_VIDEO.clips[cs];
  if(!c||(!CAPD_VIDEO.yt&&!CAPD_VIDEO.vimeo)) return CAPD[cs].svg;
  const credit=CAPD_VIDEO.credit?`，${CAPD_VIDEO.credit}`:'';
  const hint=CAPD[cs].watch
    ?`<div class="hint">▶ 這一段看影片就好（約 ${c[1]-c[0]} 秒${credit}），不用動手。想再看就按影片上的 ▶。</div>`
    :`<div class="hint">▶ 先看這段示範（約 ${c[1]-c[0]} 秒${credit}），再照著下面的說明做一次。想再看就按影片上的 ▶。</div>`;
  if(CAPD_VIDEO.yt){
    const url=`https://www.youtube-nocookie.com/embed/${CAPD_VIDEO.yt}?start=${c[0]}&end=${c[1]}&rel=0&modestbranding=1&iv_load_policy=3&cc_lang_pref=zh-TW&autoplay=1`;
    return `<div class="video capd-clip"><iframe src="${url}" style="position:absolute;inset:0;width:100%;height:100%;border:0;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>${hint}`;
  }
  // Vimeo 沒有 end 參數：用下方的 message 監聽，在剪段結尾自動暫停並跳回段落開頭
  const url=`https://player.vimeo.com/video/${CAPD_VIDEO.vimeo}?dnt=1&title=0&byline=0&portrait=0&autoplay=1#t=${c[0]}s`;
  return `<div class="video capd-clip"><iframe id="capdVimeo" src="${url}" style="position:absolute;inset:0;width:100%;height:100%;border:0;" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>
    ${hint}`;
}

/* Vimeo 剪段控制：到段落結尾自動暫停；病人捲回去或按「再看一次」會重新生效 */
let capdClipStopped=false, capdArmTimer=null, capdArmed=false;
function capdVimeoPost(method,value){ const f=document.getElementById('capdVimeo');
  if(f&&f.contentWindow) f.contentWindow.postMessage(JSON.stringify({method,value}),'https://player.vimeo.com'); }
function armCapdVimeo(){ // 反覆嘗試訂閱播放進度，直到收到第一筆為止
  clearInterval(capdArmTimer); capdArmed=false; let n=0;
  capdArmTimer=setInterval(()=>{ if(capdArmed||++n>15){ clearInterval(capdArmTimer); return; }
    capdVimeoPost('addEventListener','playProgress'); capdVimeoPost('addEventListener','timeupdate'); },800); }
window.addEventListener('message',e=>{
  if(e.origin!=='https://player.vimeo.com') return;
  let d; try{ d=typeof e.data==='string'?JSON.parse(e.data):e.data; }catch(err){ return; }
  const s=steps[i]; if(!s||s.type!=='capd') return;
  const c=CAPD_VIDEO.clips[state.capdStep]; if(!c) return;
  if(d.event==='ready'){ capdVimeoPost('addEventListener','playProgress'); capdVimeoPost('addEventListener','timeupdate'); }
  else if((d.event==='playProgress'||d.event==='timeupdate')&&d.data){ capdArmed=true;
    const sec=d.data.seconds;
    if(sec<c[1]-1) capdClipStopped=false;
    else if(sec>=c[1]&&!capdClipStopped){ capdClipStopped=true;
      // 播完自動暫停並跳回本段開頭：之後再按播放就是重看這一段，不會跑到別段
      capdVimeoPost('pause'); capdVimeoPost('setCurrentTime',c[0]); }
  }
});

/* ── CAPD 五步驟示意圖：改用 Gemini 生成的插畫 img/capd-1..5.png（見上方 CAPD 陣列） ── */


function answer(id,x,c){ state.answers[id]=!!c; state._picked=x; state._focus='next'; render(); }
function toggleConcern(t,x){ const a=state.concerns; a.includes(t)?a.splice(a.indexOf(t),1):a.push(t); state._focus='item'+x; render(); }
function toggleAsk(t,x){ const a=state.asks; a.includes(t)?a.splice(a.indexOf(t),1):a.push(t); state._focus='item'+x; render(); }
function setLean(v){ state.leaning=v; state._focus='next'; render(); }

function updateNext(){ const s=steps[i],btn=document.getElementById('nextBtn'); btn.disabled=false;
  btn.textContent=i===0?'開始 ▶':(steps[i+1]&&steps[i+1].type==='summary'?'完成並產生摘要 ▶':'下一步 ▶');
  if(s.type==='quiz'&&state.answers[s.id]===undefined){btn.disabled=true; btn.textContent='請先作答';}
  if(s.type==='leaning'&&!state.leaning){btn.disabled=true; btn.textContent='請先選一個';}
  if(s.type==='capd'){ const st=CAPD[state.capdStep];
    btn.style.display='inline-block'; document.getElementById('backBtn').textContent='◀ 上一步';
    btn.textContent = st.watch?'下一步 ▶':(state.capdStep<CAPD.length-1?'完成這一步 ▶':'我完成體驗了 ▶'); }
  else if(s.type==='summary'){btn.style.display='none'; document.getElementById('backBtn').textContent='◀ 重看內容';}
  else{btn.style.display='inline-block'; document.getElementById('backBtn').textContent='◀ 上一步';}
}
function next(){
  if(steps[i].type==='capd'&&state.capdStep<CAPD.length-1){ state.capdStep++; render(); return; }
  if(i<steps.length-1){state._picked=undefined; state._focus='first'; i++; render();}
}
function prev(){
  if(steps[i].type==='capd'&&state.capdStep>0){ state.capdStep--; state._focus='first'; render(); return; }
  if(i>0){state._picked=undefined; state._focus='first'; if(steps[i].type==='capd')state.capdStep=0; i--; render();}
}

/* 護理師摘要 */
function leanText(){ return ({pd:'體驗後想選／想試 腹膜透析（洗肚子）',more:'對腹膜透析有興趣、想多了解',other:'想了解其他治療'})[state.leaning]||'未填'; }
function summaryHTML(){
  const cls=({pd:'pd',more:'more',other:'other'})[state.leaning]||'more';
  const done = state.capdStep>=CAPD.length-1;
  const n=new Date(), ts=`${n.getMonth()+1}/${n.getDate()} ${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
  return `<div class="summary"><div class="head"><b>護理師確認單　給最後 10 分鐘的對話</b>
      <span>完成時間：${ts}</span></div>
    <div class="srow"><div class="k">目前傾向</div><span class="lean ${cls}">${leanText()}</span></div>
    <div class="srow"><div class="k">腹膜透析換液體驗</div>${done?`<span class="pill">已完成體驗（親手做：接管、分離）</span>`:'<span class="hint">未完成體驗（可陪同再做一次）</span>'}</div>
    <div class="srow"><div class="k">病人想問的問題</div>${state.asks.length?state.asks.map(a=>`<div class="ask">${a}</div>`).join(''):'<span class="hint">無特別勾選</span>'}</div></div>
  <div class="toolbar">
    <button class="btn primary focusable" onclick="window.print()">🖨 列印 / 存檔</button>
    <button class="btn ghost focusable" onclick="restart()">換下一位（清空重來）</button>
  </div>
  <p class="hint">※ 資料僅存在本次畫面，重新整理或換人即清除。摘要不含身分證等資料，僅作為和護理師討論用。</p>`;
}
function restart(){ Object.assign(state,{name:"",answers:{},concerns:[],asks:[],leaning:null,capdStep:0,_picked:undefined,_focus:'first'}); i=0; render(); }

/* 隨機打亂每題選項順序 */
function shuffle(a){ for(let j=a.length-1;j>0;j--){ const r=Math.floor(Math.random()*(j+1)); const t=a[j]; a[j]=a[r]; a[r]=t; } }
steps.forEach(s=>{ if(s.type==='quiz') shuffle(s.options); });

render();
</script>
